[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    snowflake: Snowflake-specific tests
    databricks: Databricks-specific tests
    duckdb: DuckDB file-based tests
    generic: Generic SQL dialect tests
    api: FastAPI endpoint tests
    integration: Integration tests
